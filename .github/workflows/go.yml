name: Go build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            extension: ''
          - os: windows-latest
            target: windows-amd64
            extension: '.exe'
          - os: macos-15
            target: darwin-arm64
            extension: ''
          - os: macos-15-intel
            target: darwin-amd64
            extension: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev xvfb
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test and vet
        env:
          DISPLAY: :99
        run: |
          go test ./...
          go vet ./...
          go mod verify
      - name: Coverage
        if: runner.os == 'Linux'
        env:
          DISPLAY: :99
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func coverage.out | tee coverage-summary.txt
          go tool cover -html coverage.out -o coverage.html
          cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage-summary.txt
            coverage.html
          if-no-files-found: error
      - name: Create build directory
        shell: bash
        run: mkdir -p build
      - name: Build native binary
        run: go build -o build/space-invaders-${{ matrix.target }}${{ matrix.extension }} .
      - uses: actions/upload-artifact@v7
        with:
          name: space-invaders-${{ matrix.target }}
          path: build/space-invaders-*
          if-no-files-found: error

  browser:
    name: Browser (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test scripts/*.test.mjs
      - run: node scripts/test-browser-storage.mjs
      - run: go run ./cmd/web
      - run: node scripts/package-pages.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: space-invaders-web
          path: build/pages
          retention-days: 14
          if-no-files-found: error
      # Deployment intentionally deferred under issue #4. No secrets or uploads
      # to Cloudflare are used by this workflow.
